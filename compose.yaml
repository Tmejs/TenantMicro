services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: tenantmicro
      POSTGRES_USER: tenantmicro
      POSTGRES_PASSWORD: tenantmicro-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantmicro -d tenantmicro"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev
    ports:
      - "8080:8080"
    volumes:
      - ./dev/realm.json:/opt/keycloak/data/import/realm.json:ro
